<div class="page-container">
  <div class="form-card">
    <h1>{{ 'request.create.title' | translate }}</h1>
    <p class="subtitle">{{ 'request.create.subtitle' | translate }}</p>

    @if (error) {
      <div class="alert alert-error">{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">{{ 'request.create.titleLabel' | translate }}</label>
        <input
          id="title"
          type="text"
          [(ngModel)]="title"
          name="title"
          [placeholder]="'request.create.titlePlaceholder' | translate"
          required
        />
      </div>

      <div class="form-group">
        <label for="category">{{ 'request.create.categoryLabel' | translate }}</label>
        <select id="category" [(ngModel)]="category" name="category" required>
          <option value="" disabled>{{ 'request.create.categoryPlaceholder' | translate }}</option>
          @for (cat of categories; track cat[0]) {
            <option [value]="cat[0]">{{ ('category.' + cat[0]) | translate }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="location">{{ 'request.create.locationLabel' | translate }}</label>
        <input
          id="location"
          type="text"
          [(ngModel)]="location"
          name="location"
          [placeholder]="'request.create.locationPlaceholder' | translate"
          required
        />
      </div>

      <div class="form-group">
        <label for="description">{{ 'request.create.descriptionLabel' | translate }}</label>
        <textarea
          id="description"
          [(ngModel)]="description"
          name="description"
          rows="5"
          [placeholder]="'request.create.descriptionPlaceholder' | translate"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label>{{ 'request.create.photosLabel' | translate }}</label>
        <div class="file-upload">
          <input
            type="file"
            accept="image/*"
            multiple
            (change)="onFileSelect($event)"
            id="photos"
          />
          <label for="photos" class="file-label">
            <span>📷</span> {{ 'request.create.photosCta' | translate }}
          </label>
        </div>

        @if (previewUrls.length) {
          <div class="photo-previews">
            @for (url of previewUrls; track url; let i = $index) {
              <div class="preview-item">
                <img [src]="url" alt="Preview" />
                <button type="button" class="remove-btn" (click)="removePhoto(i)">✕</button>
              </div>
            }
          </div>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
        {{ (loading ? 'request.create.submittingBtn' : 'request.create.submitBtn') | translate }}
      </button>
    </form>
  </div>
</div>
